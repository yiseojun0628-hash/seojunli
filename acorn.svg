<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="nutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c98a"/>
      <stop offset="55%" stop-color="#dba85f"/>
      <stop offset="100%" stop-color="#b9793a"/>
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c6c42"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>
    <pattern id="capTexture" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="url(#capGradient)"/>
      <path d="M0 12 Q8 2 16 12" fill="none" stroke="#4f3018" stroke-width="1.6" opacity="0.8"/>
      <path d="M-8 12 Q0 2 8 12" fill="none" stroke="#4f3018" stroke-width="1.6" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="226" rx="46" ry="9" fill="#6b4226" opacity="0.15"/>

  <!-- nut body -->
  <path d="M 54 118
           C 38 150, 46 196, 100 226
           C 154 196, 162 150, 146 118
           C 146 118, 122 132, 100 132
           C 78 132, 54 118, 54 118 Z"
        fill="url(#nutGradient)" stroke="#8a5a34" stroke-width="2"/>

  <!-- nut highlight -->
  <ellipse cx="78" cy="150" rx="14" ry="30" fill="#ffffff" opacity="0.25"/>

  <!-- tip dimple -->
  <path d="M 94 220 Q 100 228 106 220" fill="none" stroke="#8a5a34" stroke-width="2" stroke-linecap="round"/>

  <!-- acorn cap -->
  <path d="M 36 120
           C 30 78, 50 28, 100 22
           C 150 28, 170 78, 164 120
           C 164 120, 132 100, 100 100
           C 68 100, 36 120, 36 120 Z"
        fill="url(#capTexture)" stroke="#4f3018" stroke-width="2.5"/>

  <!-- cap rim highlight -->
  <path d="M 40 116 C 60 100, 80 94, 100 94 C 120 94, 140 100, 160 116"
        fill="none" stroke="#c9a877" stroke-width="2" opacity="0.5"/>

  <!-- stem -->
  <path d="M 116 26
           C 124 14, 140 10, 150 16
           C 146 24, 132 28, 120 32
           C 118 30, 117 28, 116 26 Z"
        fill="#5a3a20" stroke="#3f2814" stroke-width="1.5"/>
</svg>
